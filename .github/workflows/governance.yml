name: Governance & Structure

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-structure:
    name: Structural Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Structural Validation Script
        id: validate-structure
        timeout-minutes: 2
        run: |
          chmod +x scripts/validate-structure.sh
          ./scripts/validate-structure.sh
